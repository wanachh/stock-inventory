services:
  - type: web
    name: stockpulse-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    region: singapore
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: APP_PASSCODE
        sync: false
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: CORS_ORIGINS
        sync: false
